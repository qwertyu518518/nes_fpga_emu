<text x="72" y="648" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">strobe 为 1 时读 → 返回当前 buttons[0]，移位寄存器与计数器都不动</text>
<text x="72" y="663" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">strobe 由 1 变 0 → 停止装载，停在最后一个时钟沿看到的快照上</text>
