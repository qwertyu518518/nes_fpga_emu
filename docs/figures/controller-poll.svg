<rect x="60" y="592" width="1060" height="116" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="590" y="613" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">为什么这是电平而不是边沿（三种情况都必须成立）</text>
