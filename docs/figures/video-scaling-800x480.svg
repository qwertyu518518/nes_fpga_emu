<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-label="256x240 到 800x480：水平 3:1+每 8 取 4，垂直 2:1">
<defs><style>
