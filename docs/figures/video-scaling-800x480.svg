<rect x="0" y="0" width="1160" height="700" fill="var(--bg)"/>
<text x="580" y="32" font-size="17" fill="var(--text)" text-anchor="middle" font-weight="700" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">视频缩放：3.125× 水平 + 2.0× 垂直</text>
<text x="580" y="53" font-size="12.5" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rtl/nes_core/video/nes_video_800x480.v · frame_mem 真双口 BRAM</text>
<rect x="40" y="110" width="520" height="190" rx="6" fill="var(--panel)" stroke="var(--green)" stroke-width="1.6"/>
<text x="300" y="131" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">水平：32 组 × 25 dot</text>
<text x="52" y="151" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">src_col = {group_count[4:0], mod8_count[2:0]}</text>
<text x="52" y="166" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">group_rolls = (mod8_count == 7)</text>
<text x="52" y="181" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">col_done = emit_step &amp;&amp; group_rolls ? emit_slot==3</text>
<text x="52" y="196" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">                                   : emit_slot==2</text>
<text x="52" y="211" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">256 输入像素 → 每像素 3 个 + 每 8 个补 1 个</text>
<text x="52" y="226" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">32×25 = 800，每行精确回到 0</text>
