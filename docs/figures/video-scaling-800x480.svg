<text x="300" y="361" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">frame_mem（真双口 BRAM，61440×16b）</text>
<text x="52" y="381" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">写口 wr_clk=core_clk：</text>
<text x="52" y="396" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  mem_write_addr = {in_y, in_x}</text>
<text x="52" y="411" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  每可见 dot 写一次（strobe=ce_ppu&amp;&amp;pixel_valid）</text>
<text x="52" y="426" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">读口 rd_clk=lcd_clk：</text>
<text x="52" y="441" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  mem_read_addr = {src_row, src_col_next}</text>
<text x="52" y="456" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  同沿读出，无握手 / 无同步器</text>
<rect x="600" y="390" width="520" height="130" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="860" y="411" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">光栅时序（参数为厂商 lcd_driver 值）</text>
<text x="612" y="431" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">hcount 0..1055  vcount 0..524</text>
<text x="612" y="446" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">H: SYNC128/BACK88/DISP800/FRONT40</text>
<text x="612" y="461" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">V: SYNC2/BACK33/DISP480/FRONT10</text>
<text x="612" y="476" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">DE 窗口 [216,1016) × [35,515)</text>
<text x="612" y="491" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">hs/vs 在 DE 模式下恒 1</text>
<rect x="40" y="552" width="1080" height="96" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="52" y="573" font-size="15" fill="var(--text)" text-anchor="start" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">为什么不能只用 ce 变频</text>
<text x="52" y="593" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">25 MHz 不是 21.477 MHz 的整数倍 → 面板不能在 core_clk 上用使能驱动</text>
<text x="52" y="608" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">像素必须在真实的 25 MHz 沿离开；frame_mem 的双口 RAM 就是这次跨域，零额外逻辑</text>
