<rect x="0" y="0" width="1160" height="730" fill="var(--bg)"/>
<text x="580" y="32" font-size="17" fill="var(--text)" text-anchor="middle" font-weight="700" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">OAM DMA：总线主设备 + 513/514 周期停机</text>
<text x="580" y="53" font-size="12.5" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rtl/nes_core/ppu/nes_oam_dma.v · $4014 page -&gt; 256 × $2004</text>
<rect x="40" y="140" width="250" height="150" rx="6" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.6"/>
<text x="165" y="161" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">start 锁存</text>
<text x="52" y="181" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">锁 src_page → page_q</text>
<text x="52" y="196" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">read_addr_q = {page, 8'h00}</text>
<text x="52" y="211" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">锁 oam_base_q / oam_cur_q</text>
<text x="52" y="226" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">index_q &lt;= 0</text>
<rect x="330" y="150" width="180" height="90" rx="6" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="420" y="171" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">ST_IDLE</text>
<text x="342" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">等 start</text>
<rect x="530" y="150" width="180" height="90" rx="6" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="620" y="171" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">ST_ALIGN</text>
<text x="542" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">dummy 1 或 2 拍</text>
<text x="542" y="206" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">OAMADDR_WRITE=1</text>
<text x="542" y="221" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"> 时在 dummy 拍发 $2003</text>
<rect x="730" y="150" width="180" height="90" rx="6" fill="var(--panel)" stroke="var(--green)" stroke-width="1.6"/>
<text x="820" y="171" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">ST_READ</text>
<text x="742" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">发 cpu_read_req</text>
<text x="742" y="206" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">等 cpu_read_ack</text>
<rect x="930" y="150" width="180" height="90" rx="6" fill="var(--panel)" stroke="var(--green)" stroke-width="1.6"/>
<text x="1020" y="171" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">ST_WRITE</text>
<text x="942" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">一次 $2004 写</text>
<text x="942" y="206" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">index_q==FF → done</text>
<path d="M 290 215 L 328 195" fill="none" stroke="var(--purple)" stroke-width="1.6" marker-end="url(#arw-purple)"/>
<path d="M 510 195 L 528 195" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<path d="M 710 195 L 728 195" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<path d="M 910 195 L 928 195" fill="none" stroke="var(--green)" stroke-width="1.6" marker-end="url(#arw-green)"/>
<path d="M 1020 240 L 1020 272 L 820 272 L 820 242" fill="none" stroke="var(--green)" stroke-width="1.6" marker-end="url(#arw-green)"/>
<path d="M 950 150 L 950 118 L 420 118 L 420 148" fill="none" stroke="var(--red)" stroke-width="1.6" marker-end="url(#arw-red)"/>
<text x="1042" y="266" font-size="11" fill="var(--green)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">读-写交替</text>
<text x="760" y="110" font-size="11" fill="var(--red)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">done（第 256 次写）</text>
<rect x="40" y="330" width="380" height="150" rx="6" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.6"/>
<text x="230" y="351" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">周期账</text>
<text x="52" y="371" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cycle_count 从 start 拍编号为 1</text>
<text x="52" y="386" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">偶数对齐 1 + 256×2 = 513</text>
<text x="52" y="401" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">奇数对齐 2 + 256×2 = 514</text>
<text x="52" y="416" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">对齐拍不额外占周期（$2003 搭车）</text>
<text x="52" y="431" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">延迟 ack：512 + align + 256×(1+ack)</text>
<rect x="460" y="330" width="340" height="150" rx="6" fill="var(--panel)" stroke="var(--green)" stroke-width="1.6"/>
<text x="630" y="351" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">总线握手</text>
<text x="472" y="371" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cpu_read_req   电平</text>
<text x="472" y="386" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cpu_read_addr  {page, index}</text>
<text x="472" y="401" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cpu_read_ack   可延迟任意拍</text>
<text x="472" y="416" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cpu_rdata      ack 同拍有效</text>
<text x="472" y="431" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cpu_hold = busy（513/514 拍）</text>
<rect x="840" y="330" width="290" height="150" rx="6" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="985" y="351" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">OAMADDR 两种接法</text>
<text x="852" y="371" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">OAMADDR_WRITE=0 默认</text>
<text x="852" y="386" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  CPU 在 $4014 前写 $2003</text>
<text x="852" y="401" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">OAMADDR_WRITE=1</text>
<text x="852" y="416" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  本模块在 align 拍发 $2003</text>
<text x="852" y="431" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">两种接法 256 字节内容相同</text>
<rect x="40" y="510" width="540" height="130" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="310" y="531" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">输出稳定性</text>
<text x="52" y="551" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">cpu_read_req 与 ppu_reg_cs 永不同拍</text>
<text x="52" y="566" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">read_addr_q 只在 ack 时 +1</text>
<text x="52" y="581" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ppu_reg_* 只由 state 决定</text>
<text x="52" y="596" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">所有输出 = 寄存器的组合函数</text>
<rect x="620" y="510" width="510" height="130" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="875" y="531" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">边界（与 PPU 的切分）</text>
<text x="632" y="551" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">OAM RAM 本体在 nes_ppu2c02</text>
<text x="632" y="566" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">$2004 写由外部驱动</text>
<text x="632" y="581" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">真实 OAMADDR 自增由 PPU 完成</text>
<text x="632" y="596" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">可见区 DMA 撕裂不检测（硬件也不）</text>
