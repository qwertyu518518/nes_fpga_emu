<text x="1002" y="271" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">读口提交 / 寄存输出</text>
<text x="860" y="291" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_data &lt;= mem[rd_bin]</text>
<text x="860" y="306" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">空时 rd_data 保持上一拍值</text>
<rect x="848" y="376" width="308" height="110" rx="6" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/>
<text x="1002" y="397" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rd_empty 比较</text>
<text x="860" y="417" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_gray_next == wr_sync2</text>
<text x="860" y="432" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">整字相等即无数据</text>
<text x="860" y="447" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">复位后初值 1</text>
<rect x="420" y="120" width="360" height="110" rx="6" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.6"/>
<text x="600" y="141" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">mem（双时钟 SDP）</text>
<text x="432" y="161" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">写 mem[wr_bin] @ wr_clk</text>
<text x="432" y="176" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">读 mem[rd_bin] @ rd_clk</text>
<text x="432" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">每 bit 一对触发器（多推断为 BRAM）</text>
<text x="432" y="206" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">复位不清阵列</text>
