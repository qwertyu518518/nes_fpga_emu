<text x="600" y="295" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">格雷指针同步器</text>
<text x="432" y="315" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_gray_sync1/2  位于 wr_clk</text>
<text x="432" y="330" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">wr_gray_sync1/2  位于 rd_clk</text>
<text x="432" y="345" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">(* ASYNC_REG *) 两级相邻</text>
<text x="432" y="360" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">每拍只翻一位 → 不会撕裂</text>
<rect x="420" y="452" width="360" height="120" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="600" y="473" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">为什么指针多一位</text>
<text x="432" y="493" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">深度 = 2^ADDR，指针 0..2^(ADDR+1)-1</text>
<text x="432" y="508" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">多出的最高位区分满与空</text>
<text x="432" y="523" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">满 = 最高两位取反的格雷签名</text>
