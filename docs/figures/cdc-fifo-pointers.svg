<text x="198" y="271" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">写口提交</text>
<text x="56" y="291" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">wr_en &amp;&amp; !wr_full → 指针 +1</text>
<text x="56" y="306" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">满时写被忽略，指针不动</text>
<rect x="44" y="376" width="308" height="110" rx="6" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/>
<text x="198" y="397" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">wr_full 比较</text>
<text x="56" y="417" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">wr_gray_next ==</text>
<text x="56" y="432" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">{~rd_sync2[top:top-1], rd_sync2[top-2:0]}</text>
<text x="56" y="447" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">用延迟的读指针判定</text>
<rect x="848" y="120" width="308" height="100" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="1002" y="141" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rd_bin / rd_gray</text>
<text x="860" y="161" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_bin 低位 → mem 读地址</text>
<text x="860" y="176" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_gray = bin ^ (bin &gt;&gt; 1)</text>
<text x="860" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">提交：rd_en &amp;&amp; !rd_empty</text>
