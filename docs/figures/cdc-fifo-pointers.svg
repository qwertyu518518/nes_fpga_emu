<rect x="0" y="0" width="1200" height="700" fill="var(--bg)"/>
<text x="600" y="32" font-size="17" fill="var(--text)" text-anchor="middle" font-weight="700" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">异步 FIFO：跨域只传格雷码指针</text>
<text x="600" y="53" font-size="12.5" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rtl/nes_core/peripheral/nes_cdc_fifo.v · 每拍最多翻一位</text>
