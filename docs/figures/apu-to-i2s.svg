<rect x="0" y="0" width="1200" height="700" fill="var(--bg)"/>
<text x="600" y="32" font-size="17" fill="var(--text)" text-anchor="middle" font-weight="700" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">音频通路：混合 → 有理抽取 → CDC FIFO → I2S</text>
<text x="600" y="53" font-size="12.5" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">nes_apu2a03.v + nes_zynq_top.v + nes_audio_i2s.v + nes_cdc_fifo.v</text>
<rect x="40" y="110" width="250" height="220" rx="6" fill="var(--panel)" stroke="var(--green)" stroke-width="1.6"/>
<text x="165" y="131" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">nes_apu2a03 混合</text>
<text x="52" y="151" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">pulse1/2 level(4b) → pulse_sum</text>
<text x="52" y="166" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">pulse_mix_lut → mix_pulse(16b)</text>
<text x="52" y="181" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<text x="52" y="196" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">tri·noise·dmc → tnd_sum</text>
<text x="52" y="211" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">tnd_mix_lut → mix_tnd(16b)</text>
<text x="52" y="226" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<text x="52" y="241" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">mix_sum = mix_pulse + mix_tnd</text>
<text x="52" y="256" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">saturate → mixed_sample(16b)</text>
<text x="165" y="352" font-size="11" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">sample_valid @ ce &amp;&amp; ce_sample</text>
<text x="165" y="368" font-size="11" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">= 21477272.727/12 = 1.789772727 MHz</text>
<rect x="360" y="110" width="300" height="220" rx="6" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="510" y="131" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">抽取滤波（core_clk）</text>
<text x="372" y="151" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ma1 4 抽头 → /4   (18b 和)</text>
<text x="372" y="166" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ma2 4 抽头 → /4   (20b 和)</text>
<text x="372" y="181" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ma3 2 抽头 + 2:1 → /2</text>
<text x="372" y="196" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">总速率 /32，DC 增益恒 1</text>
<text x="372" y="211" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<text x="372" y="226" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">有理 63/55（Bresenham 累加器）</text>
<text x="372" y="241" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  rat_hit = (rat_acc+55) &gt;= 63</text>
<text x="372" y="256" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  2016 进 55 出，余数为零</text>
<text x="372" y="271" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">&gt;&gt;5 前 +16 四舍五入</text>
<path d="M 290 200 L 358 200" fill="none" stroke="var(--green)" stroke-width="1.6" marker-end="url(#arw-green)"/>
<text x="324" y="188" font-size="11" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">16b×2</text>
<rect x="730" y="110" width="240" height="220" rx="6" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.6"/>
<text x="850" y="131" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">nes_cdc_fifo  (深度 64)</text>
<text x="742" y="151" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">写 {wr_right, wr_left} 32b</text>
<text x="742" y="166" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">格雷码指针 + 2FF 同步</text>
<text x="742" y="181" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">wr_full 回压 / rd_empty</text>
<text x="742" y="196" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ADDR_WIDTH=6</text>
<text x="742" y="211" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<text x="742" y="226" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">wr_clk = core_clk</text>
<text x="742" y="241" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_clk = lcd_clk</text>
<path d="M 660 200 L 728 200" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<text x="694" y="150" font-size="11" fill="var(--blue)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">dec_valid</text>
<text x="694" y="165" font-size="11" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">48828.125 Hz</text>
<rect x="1030" y="110" width="130" height="220" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="1095" y="131" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">I2S 移位器</text>
<text x="1042" y="151" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">32b 位串行</text>
<text x="1042" y="166" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">16+16 位</text>
<text x="1042" y="181" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">MSB first</text>
<text x="1042" y="196" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<text x="1042" y="211" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">左先出</text>
<text x="1042" y="226" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">lrck 第 17</text>
<text x="1042" y="241" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">位翻转</text>
<path d="M 970 200 L 1028 200" fill="none" stroke="var(--purple)" stroke-width="1.6" marker-end="url(#arw-purple)"/>
<rect x="1030" y="380" width="130" height="120" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="1095" y="401" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">输出寄存</text>
<text x="1042" y="421" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">dout 加一拍</text>
<text x="1042" y="436" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">lrck 不延</text>
<path d="M 1095 330 L 1095 378" fill="none" stroke="var(--orange)" stroke-width="1.6" marker-end="url(#arw-orange)"/>
<rect x="730" y="380" width="240" height="120" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="850" y="401" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">BCLK 分频（mclk=lcd_clk）</text>
<text x="742" y="421" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">BCLK_DIV=16</text>
<text x="742" y="436" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">25 MHz / 16 = 1.5625 MHz</text>
<text x="742" y="451" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">rd_ce = bclk 上升沿脉冲</text>
<path d="M 850 378 L 850 332" fill="none" stroke="var(--orange)" stroke-width="1.6"/>
<path d="M 970 440 L 1028 440" fill="none" stroke="var(--orange)" stroke-width="1.6" marker-end="url(#arw-orange)"/>
<rect x="40" y="470" width="620" height="150" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="350" y="491" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">为什么是精确有理 63/55，而不是 /37</text>
<text x="52" y="511" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">1.789772727 MHz / 37 = 48372.235 Hz，比 48 kHz 高 0.7755%</text>
<text x="52" y="526" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">FIFO 单生产者/单消费者：任何速率失配都会让水位走到满或空</text>
<text x="52" y="541" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">整数抽取与 25 MHz 侧帧率精确相等：仅 126·D/55 为整数，D=55→14204 Hz</text>
<text x="52" y="556" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">D=16 时 126·16/55 = 2016/55，非整数 → 用精确有理抽取</text>
<text x="52" y="571" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">4/4/2 串联零点：447/447/894 kHz，帧率处约 0.35 dB，DC 增益 1</text>
<rect x="700" y="520" width="336" height="30" rx="6" fill="var(--panel2)" stroke="var(--border)" stroke-width="1.2"/>
<text x="712" y="540" font-size="11" fill="var(--muted)" text-anchor="start" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">图例</text>
<path d="M 746 535 L 768 535" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<text x="772" y="540" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">样点流</text>
<rect x="815" y="528" width="22" height="14" rx="3" fill="var(--panel)" stroke="var(--green)" stroke-width="1.4"/>
<text x="841" y="540" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">core_clk 侧</text>
<rect x="929" y="528" width="22" height="14" rx="3" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.4"/>
<text x="955" y="540" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">跨域 / CDC</text>
