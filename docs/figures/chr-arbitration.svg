<text x="392" y="291" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">                       : bg_chr_req)</text>
<text x="392" y="306" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_addr = chr_rd_win ? v_addr[13:0]</text>
<text x="392" y="321" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">         : (sp_bus_sel ? sp_addr</text>
<text x="392" y="336" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">         : bg_addr)</text>
<text x="392" y="351" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<text x="392" y="366" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_hold_bg = chr_rd_win &amp;&amp;</text>
<text x="392" y="381" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">              bg_chr_req</text>
<text x="392" y="396" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_hold_sp = chr_rd_win &amp;&amp;</text>
<text x="392" y="411" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">              sp_chr_req</text>
<path d="M 290 158 L 378 230" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<path d="M 290 288 L 378 300" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<path d="M 290 418 L 378 380" fill="none" stroke="var(--orange)" stroke-width="1.6" marker-end="url(#arw-orange)"/>
<rect x="40" y="500" width="640" height="96" rx="6" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/>
<text x="360" y="521" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">冻结（arm 命中本单元 chr_req 时）</text>
<text x="52" y="541" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ce_bg = ce &amp;&amp; !chr_hold_bg    ce_sp = ce &amp;&amp; !chr_hold_sp</text>
<text x="52" y="556" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">状态/地址/请求寄存器不动一拍，下一 ce 同地址重发</text>
<text x="52" y="571" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">arm 有零余量，只能冻结取数侧；地址不变 → 重发同一拍</text>
<rect x="740" y="120" width="380" height="130" rx="6" fill="var(--panel)" stroke="var(--green)" stroke-width="1.6"/>
<text x="930" y="141" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">地址翻译（本地 14b → 最终 17b）</text>
<text x="752" y="161" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">mapper_ppu_addr =</text>
<text x="752" y="176" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">  {ppu_chr_we?0:addr[13], addr[12:0]}</text>
<text x="752" y="191" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">→ nes_mapper.chr_bank_offset (17b)</text>
<text x="752" y="206" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">→ chr_final_addr</text>
