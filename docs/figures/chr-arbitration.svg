<rect x="0" y="0" width="1160" height="820" fill="var(--bg)"/>
<text x="580" y="32" font-size="17" fill="var(--text)" text-anchor="middle" font-weight="700" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">CHR 仲裁：三个读主设备 + 一个独立写口</text>
<text x="580" y="53" font-size="12.5" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rtl/nes_core/ppu/nes_ppu2c02.v (g_chr_external) + nes_system_v6.v</text>
