<text x="752" y="341" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">CHR-only 实例（PRG_ENABLE=0）</text>
<text x="752" y="356" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">8 KiB，索引 chr_addr[12:0]（镜像）</text>
<text x="752" y="371" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">读口：ce_ppu = !reset &amp;&amp; div_phase[1:0]==0</text>
<text x="752" y="386" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">门控 chr_req，寄存器输出 chr_rdata</text>
<text x="752" y="401" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">独立写口与读口地址无关</text>
<path d="M 738 190 L 738 300" fill="none" stroke="var(--green)" stroke-width="1.6" marker-end="url(#arw-green)"/>
<text x="700" y="250" font-size="11" fill="var(--green)" text-anchor="end" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">chr_final_addr</text>
<rect x="740" y="500" width="380" height="130" rx="6" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/>
<text x="930" y="521" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">$2007 写口（独立地址）</text>
<text x="752" y="541" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_waddr[13:0] = v_addr[13:0] (&lt;$2000)</text>
<text x="752" y="556" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_we 单拍；chr_wdata = reg_din</text>
<text x="752" y="571" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">→ u_cart_chr.chr_windex（独立写地址）</text>
<text x="752" y="586" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">读改写同时命中 → 读优先返回旧字节</text>
<path d="M 680 440 L 738 510" fill="none" stroke="var(--red)" stroke-width="1.6" marker-end="url(#arw-red)"/>
<text x="700" y="480" font-size="11" fill="var(--red)" text-anchor="end" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_waddr/we</text>
<text x="60" y="640" font-size="12.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">读口三条主设备共享一个 chr_rdata；谁赢得仲裁，chr_rdata 就是谁那一拍的字节。</text>
<text x="60" y="662" font-size="12.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">写口有独立地址，因此 $2007 写不再需要冻结取数单元（风险 L-17 的写法已退役）。</text>
