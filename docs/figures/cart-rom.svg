<rect x="0" y="0" width="1220" height="840" fill="var(--bg)"/>
<text x="610" y="32" font-size="17" fill="var(--text)" text-anchor="middle" font-weight="700" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">卡带 ROM：$readmemh 内容、读通路与唯一的共用写口</text>
<text x="610" y="53" font-size="12.5" fill="var(--muted)" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">rtl/nes_core/cart/nes_cart_rom.v · PRG 在核内、CHR 在平台顶层</text>
<rect x="40" y="92" width="1140" height="66" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="52" y="113" font-size="15" fill="var(--text)" text-anchor="start" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">$readmemh 初始化（elaboration 期 → bitstream）</text>
<text x="52" y="133" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">prg_rom[0:131071] ← $readmemh(PRG_INIT_FILE)   ·   chr_rom[0:8191] ← $readmemh(CHR_INIT_FILE)</text>
<text x="52" y="148" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">文件缺失或长度不符 → Vivado 静默优化掉数组（Block RAM Tile 计数随之下降，见 nes_zynq_top.v 头注释）</text>
<rect x="40" y="194" width="340" height="126" rx="6" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="210" y="215" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">PRG 读口（CPU 侧）</text>
<text x="52" y="235" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">prg_addr[16:0] ← mapper_prg_bank_offset</text>
<text x="52" y="250" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">prg_en 门控（低 = 保持，不返回 0）</text>
<text x="52" y="265" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">prg_rdata 一 clk 寄存读</text>
<text x="52" y="280" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">地址稳定 12 clk（div_phase 1..11 + 0）</text>
<rect x="430" y="194" width="350" height="126" rx="6" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.6"/>
<text x="605" y="215" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">prg_rom [0:131071][7:0]</text>
<text x="442" y="235" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">PRG_ENABLE=1（nes_system_v6 内）</text>
<text x="442" y="250" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">读口：prg_addr → prg_rdata</text>
<text x="442" y="265" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">写口：prg_ld_en &amp;&amp; prg_ld_we</text>
<rect x="840" y="194" width="340" height="126" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="1010" y="215" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">PRG 加载端口（PS）</text>
<text x="852" y="235" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">prg_ld_en / prg_ld_addr[16:0]</text>
<text x="852" y="250" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">prg_ld_data[7:0] / prg_ld_we</text>
<text x="852" y="265" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">唯一写口，不随 reset 门控</text>
<path d="M 380 240 L 428 240" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<path d="M 428 274 L 380 274" fill="none" stroke="var(--purple)" stroke-width="1.6" marker-end="url(#arw-purple)"/>
<path d="M 838 257 L 782 257" fill="none" stroke="var(--orange)" stroke-width="1.6" marker-end="url(#arw-orange)"/>
<rect x="40" y="344" width="340" height="150" rx="6" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.6"/>
<text x="210" y="365" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">CHR 读口（PPU 侧）</text>
<text x="52" y="385" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_addr[16:0] ← chr_final_addr</text>
<text x="52" y="400" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">ce_ppu &amp;&amp; chr_req 唯一门控</text>
<text x="52" y="415" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_rdata 在 ce_ppu 沿寄存</text>
<text x="52" y="430" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">零余量：插一级寄存器会静默返回上一字节</text>
<rect x="430" y="344" width="350" height="150" rx="6" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.6"/>
<text x="605" y="365" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">chr_rom [0:8191][7:0]</text>
<text x="442" y="385" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">CHR_ENABLE=1（nes_zynq_top 内）</text>
<text x="442" y="400" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">读口：chr_addr[12:0] → chr_rdata</text>
<text x="442" y="415" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">写口：唯一 muxed 写语句（下方）</text>
<text x="442" y="430" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">索引只用 [12:0]，高位 bank 折叠</text>
<rect x="840" y="330" width="340" height="78" rx="6" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/>
<text x="1010" y="351" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">$2007 mapper 写臂</text>
<text x="852" y="371" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_ram_enable &amp;&amp; chr_we</text>
<text x="852" y="386" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_waddr[13:0] → chr_windex[12:0]</text>
<rect x="840" y="420" width="340" height="78" rx="6" fill="var(--panel)" stroke="var(--orange)" stroke-width="1.6"/>
<text x="1010" y="441" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">PS 加载端口</text>
<text x="852" y="461" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_ld_en / chr_ld_addr[12:0]</text>
<text x="852" y="476" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_ld_data / chr_ld_we</text>
<path d="M 380 400 L 428 400" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<path d="M 428 440 L 380 440" fill="none" stroke="var(--purple)" stroke-width="1.6" marker-end="url(#arw-purple)"/>
<path d="M 838 369 L 700 538" fill="none" stroke="var(--red)" stroke-width="1.6" marker-end="url(#arw-red)"/>
<path d="M 838 459 L 740 538" fill="none" stroke="var(--orange)" stroke-width="1.6" marker-end="url(#arw-orange)"/>
<rect x="300" y="540" width="880" height="140" rx="6" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/>
<text x="740" y="561" font-size="15" fill="var(--text)" text-anchor="center" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">CHR 唯一写口：一个 muxed 写语句（不是一个 if/else）</text>
<text x="312" y="581" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_ld_wr   = (chr_ld_en === 1'b1) &amp;&amp; (chr_ld_we === 1'b1)</text>
<text x="312" y="596" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_wenable = chr_ld_wr | (chr_ram_enable &amp;&amp; chr_we)     ← 一个 if</text>
<text x="312" y="611" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_wsel    = chr_ld_wr ? chr_lindex : chr_windex</text>
<text x="312" y="626" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">chr_wdat    = chr_ld_wr ? chr_ld_data : chr_wdata</text>
<text x="312" y="641" font-size="11.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Cascadia Code, Consolas, Menlo, 'DejaVu Sans Mono', monospace">if/else 命名数组两次 = 两个写口 → Vivado 静默落入 distributed RAM（实测 2 → 0 BRAM，LUTRAM 2 → 3074）</text>
<path d="M 740 538 L 680 520" fill="none" stroke="var(--red)" stroke-width="1.4" marker-end="url(#arw-red)"/>
<text x="300" y="708" font-size="12.5" fill="var(--muted)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">PRG 只多一个写口（仅 PS 加载）；CHR 的写口由 mapper $2007 与 PS 加载共用。</text>
<rect x="44" y="786" width="373" height="30" rx="6" fill="var(--panel2)" stroke="var(--border)" stroke-width="1.2"/>
<text x="56" y="806" font-size="11" fill="var(--muted)" text-anchor="start" font-weight="600" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">图例</text>
<rect x="90" y="794" width="22" height="14" rx="3" fill="var(--panel)" stroke="var(--green)" stroke-width="1.4"/>
<text x="116" y="806" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">端口 / 逻辑</text>
<rect x="184" y="794" width="22" height="14" rx="3" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.4"/>
<text x="210" y="806" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">数组</text>
<path d="M 246 801 L 268 801" fill="none" stroke="var(--blue)" stroke-width="1.6" marker-end="url(#arw-blue)"/>
<text x="272" y="806" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">地址 / 数据</text>
<path d="M 340 801 L 362 801" fill="none" stroke="var(--orange)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arw-orange)"/>
<text x="366" y="806" font-size="11" fill="var(--text)" text-anchor="start" font-weight="normal" font-family="Segoe UI, Microsoft YaHei, system-ui, -apple-system, sans-serif">共用写口</text>
